# ==============================================================================
# Configuration Mosquitto - Workshop Sentinel-X (Groupe 16)
# ==============================================================================

per_listener_settings true

# 1. Listener MQTT standard (port 1883 - communication inter-conteneurs & debug local)
listener 1883 0.0.0.0
allow_anonymous true

# 2. Listener MQTTS sécurisé TLS (port 8883 - pour ESP8266 & production)
listener 8883 0.0.0.0
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd

# Journalisation des logs
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
